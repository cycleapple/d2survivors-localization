[package]
name = "d2s-launcher"
version = "0.2.0"
edition = "2021"
description = "D2 Survivors 中文化啟動器：切換語言、自動更新翻譯"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
rfd = "0.15"
ureq = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Shell"] }

[profile.release]
opt-level = 3
lto = true
strip = true
