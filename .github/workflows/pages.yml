# 網站：push 到 main 時重新產生靜態頁（tools/build-site.mjs），把 site/ 整個部署到 GitHub Pages。
# site/data/（manifest v2、字典）和 site/web/（書籤）是其他聊天室 commit 的，跟著一起上傳。
# repo 的 Settings → Pages → Source 要選「GitHub Actions」。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的 push 進來不取消正在跑的，免得部署到一半
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 不需要 npm install：build-site.mjs 只用 Node 內建模組
      - name: Build site
        run: node tools/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      # 啟動器連不上 GitHub Pages 時改讀 jsDelivr（gh/<repo>@main/site/data/…），jsDelivr 對 @main 最多快取 12 小時，部署完要清掉。
      # 只在這次 push 改到 site/data/ 時清（手動執行一律清）；purge 有頻率限制，一次清一輪；失敗只記警告，不讓部署失敗
      - name: Purge jsDelivr cache
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git fetch --quiet --depth=1 origin "$BEFORE" && git diff --quiet "$BEFORE" HEAD -- site/data/; then
            echo "site/data/ 沒有變動，不用清"
            exit 0
          fi
          for f in site/data/manifest.json site/data/changelog.json site/data/dict/*.json; do
            if body=$(curl -fsS --retry 2 --retry-delay 5 --max-time 30 "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@main/$f"); then
              case "$body" in
                *'"throttled":true'*) echo "::warning::jsDelivr purge throttled: $f" ;;
                *) echo "purged $f" ;;
              esac
            else
              echo "::warning::jsDelivr purge failed: $f"
            fi
          done
