# 更新公告：push 到 main、site/data/changelog.json 有變動時，把這次新增、而且 announce: true 的項目發到 Discord 的 #announcements。
# 格式見 docs/manifest-v2.md 的「更新紀錄」，哪些要公告見 docs/release.md 的「公告」。
# repo 的 Settings → Secrets and variables → Actions：
#   secret   DISCORD_WEBHOOK_UPDATES     #announcements 的 webhook 網址。沒設就跳過，不算失敗
#   variable DISCORD_UPDATE_PING_ROLE    選填，「Update Ping」身分組的 ID，有設就在公告裡 @ 它
name: Announce

on:
  push:
    branches: [main]
    paths: [site/data/changelog.json]

permissions:
  contents: read

# 依序發，不要兩次 push 的公告交錯
concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_UPDATES }}
    steps:
      - name: Skip without webhook
        if: env.DISCORD_WEBHOOK == ''
        run: echo "沒有設定 DISCORD_WEBHOOK_UPDATES，跳過"

      - uses: actions/checkout@v4
        if: env.DISCORD_WEBHOOK != ''
        with:
          # 要拿 push 之前的 changelog.json 來比
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.DISCORD_WEBHOOK != ''
        with:
          node-version: 22

      - name: Post new announcements
        if: env.DISCORD_WEBHOOK != ''
        env:
          BEFORE: ${{ github.event.before }}
          PING_ROLE: ${{ vars.DISCORD_UPDATE_PING_ROLE }}
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';

          const FILE = 'site/data/changelog.json';
          const { SITE } = await import(pathToFileURL(`${process.cwd()}/site/src/config.mjs`).href);

          const before = process.env.BEFORE ?? '';
          const previous = (() => {
            if (!before || /^0+$/.test(before)) return null;
            try {
              return JSON.parse(execFileSync('git', ['show', `${before}:${FILE}`], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }));
            } catch {
              return null;
            }
          })();
          const current = JSON.parse(readFileSync(FILE, 'utf8'));

          // 這次 push 新增的項目。抓不到上一版（第一次加這個檔、force push）時只看最新一筆，不把舊紀錄全部再發一次
          let added = current.entries ?? [];
          if (previous) {
            const seen = new Set((previous.entries ?? []).map((e) => e.version));
            added = added.filter((e) => !seen.has(e.version));
          } else {
            added = added.slice(0, 1);
          }
          const todo = added.filter((e) => e.announce === true).reverse(); // 舊的先發
          if (!todo.length) {
            console.log('沒有要公告的項目');
            process.exit(0);
          }

          const TITLE = { translation: '翻譯更新', language: '新語言', 'game-fix': '遊戲改版修正', launcher: '啟動器新版' };
          const role = process.env.PING_ROLE?.trim();
          const FOOTER = { text: '非官方玩家翻譯，與 D2 Survivors 開發者及 Blizzard Entertainment 無關 · Unofficial fan translation' };
          // 遊戲本身的更新說明放第二個 embed。一則訊息的 embed 加起來上限 6000 字，這段最多 3000 字、20 條，太長就只列前幾條、其餘連到網站
          const GAME_NOTES_MAX = 3000;
          const GAME_NOTES_ITEMS = 20;

          function gameNotesEmbed(e) {
            const g = e.gameNotes;
            const items = g?.lines?.['zh-TW']?.length ? g.lines['zh-TW'] : g?.lines?.en ?? [];
            if (!items.length) return null;
            // 官方發布時間用 Discord 的時間戳記，讀者看到的是自己的當地時間
            const unix = g.at ? Math.floor(Date.parse(g.at) / 1000) : NaN;
            const released = Number.isFinite(unix) ? `<t:${unix}:f>（<t:${unix}:R>）` : '';
            const head = [
              ...(released ? [`官方更新時間：${released}`] : []),
              'D2 Survivors 作者的更新說明，我們只做翻譯。',
              `*Patch notes by the D2 Survivors developer${released ? `, released <t:${unix}:f>` : ''}, translated by us.*`,
              '',
            ];
            const more = (n) => ['', `…還有 ${n} 條，完整內容見網站的[更新紀錄](${SITE.base}zh-tw/#changelog)`];
            const shown = [];
            for (const line of items.slice(0, GAME_NOTES_ITEMS)) {
              const next = [...head, ...shown, `• ${line}`, ...more(items.length)].join('\n');
              if (next.length > GAME_NOTES_MAX) break;
              shown.push(`• ${line}`);
            }
            const rest = items.length - shown.length;
            return {
              title: `遊戲本身的更新 · ${g.version}`,
              ...(g.source ? { url: g.source } : {}),
              description: [...head, ...shown, ...(rest ? more(rest) : [])].join('\n'),
              color: 0xc7a15a,
            };
          }

          for (const e of todo) {
            const summary = e.summary?.['zh-TW'] ?? e.summary?.en ?? '';
            const notes = e.notes?.['zh-TW'] ?? [];
            const lines = [
              summary,
              ...(e.summary?.en && e.summary.en !== summary ? [`*${e.summary.en}*`] : []),
              ...(notes.length ? ['', ...notes.map((n) => `• ${n}`)] : []),
              '',
              `🌐 ${SITE.base}`,
            ];
            const game = gameNotesEmbed(e);
            const main = {
              title: `${TITLE[e.kind] ?? '更新'} · ${e.version}`,
              url: `${SITE.base}zh-tw/`,
              description: lines.join('\n').slice(0, game ? 2500 : 4000),
              color: 0xc7a15a,
            };
            // footer 和日期放在最後一個 embed
            const embeds = [main, ...(game ? [game] : [])];
            Object.assign(embeds.at(-1), { footer: FOOTER, ...(e.date ? { timestamp: `${e.date}T00:00:00Z` } : {}) });
            const body = {
              content: role ? `<@&${role}>` : '',
              allowed_mentions: { parse: [], roles: role ? [role] : [] },
              embeds,
            };
            // 本機測試：DRY_RUN=1 只印出要送的內容，不打 webhook
            if (process.env.DRY_RUN) {
              console.log(JSON.stringify(body, null, 2));
              continue;
            }
            const res = await fetch(process.env.DISCORD_WEBHOOK, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) {
              console.error(`Discord 回應 ${res.status}：${await res.text()}`);
              process.exit(1);
            }
            console.log(`已公告 ${e.version}`);
          }
          EOF
